<stop offset="0" stop-color="#eb6c36" stop-opacity="0.22"/>
<stop offset="1" stop-color="#eb6c36" stop-opacity="0"/>
</radialGradient>
<radialGradient id="fade" cx="300" cy="140" r="520" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0c0e13" stop-opacity="0.85"/>
<stop offset="1" stop-color="#0c0e13" stop-opacity="0"/>
</radialGradient>
</defs>
<rect width="1280" height="360" rx="16" fill="#0c0e13"/>
<rect width="1280" height="360" rx="16" fill="url(#dots)"/>
<rect width="1280" height="360" rx="16" fill="url(#fade)"/>
<rect width="1280" height="360" rx="16" fill="url(#glow)"/>

